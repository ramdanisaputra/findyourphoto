<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencarian Foto AI - Web Riders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; text-transform: capitalize; border: 1px solid transparent; }
        .hitam { background-color: #1e293b; color: white; } 
        .putih { background-color: #ffffff; color: #334155; border-color: #cbd5e1; }
        .merah { background-color: #ef4444; color: white; } 
        .biru { background-color: #3b82f6; color: white; }
        .hijau { background-color: #22c55e; color: white; } 
        .kuning { background-color: #eab308; color: #451a03; }
        .oranye { background-color: #f97316; color: white; } 
        .abu-abu, .silver { background-color: #94a3b8; color: white; }
        .pink { background-color: #ec4899; color: white; }
        .cyan { background-color: #06b6d4; color: #164e63; }
        .cokelat { background-color: #8b5cf6; color: white; }
        .ungu { background-color: #a855f7; color: white; }
        .marun { background-color: #9f1239; color: white; }
        .none { display: none; }

        /* Custom Scrollbar untuk Dropdown */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    </style>
</head>
<body class="text-slate-800 pb-20 selection:bg-blue-200" onclick="tutupSemuaDropdown(event)">

    <!-- Header Ringkas -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200/80 py-3.5 px-4 md:px-8 mb-6 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-blue-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3" stroke-width="2"/></svg>
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-slate-900 leading-tight">AI Photo Finder</h1>
                    <p class="text-[11px] text-slate-500">Cari foto berdasarkan warna motor, helm & jaket</p>
                </div>
            </div>
            
            <div id="status-bar" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-blue-50 border border-blue-100 text-blue-700 text-xs font-semibold rounded-full shadow-sm transition-all">
                <svg class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Menghubungkan ke Database...
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 md:px-6">
        
        <!-- Selektor Event & Fotografer -->
        <div class="glass-card rounded-2xl p-5 md:p-6 mb-6 relative z-30">
            <div class="flex items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-100">
                <h2 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                    <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    Pilih Album & Fotografer
                </h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                
                <!-- CUSTOM DROPDOWN FOTOGRAFER -->
                <div class="md:col-span-4 relative">
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Fotografer</label>
                    
                    <!-- Tombol Trigger Dropdown -->
                    <div id="custom-photo-trigger" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl p-3 flex items-center justify-between cursor-pointer transition hover:border-blue-400 opacity-50 pointer-events-none" onclick="toggleDropdown(event)">
                        <div class="flex items-center gap-2.5" id="custom-photo-selected">
                            <span>Memuat Fotografer...</span>
                        </div>
                        <svg class="w-4 h-4 text-slate-400 transition-transform duration-200" id="custom-photo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                    </div>

                    <!-- Menu List Dropdown (Hidden default) -->
                    <div id="custom-photo-menu" class="absolute top-full mt-2 left-0 w-full bg-white border border-slate-200 rounded-xl shadow-xl z-50 hidden max-h-60 overflow-y-auto custom-scrollbar transform transition-all opacity-0 translate-y-[-10px]">
                        <ul id="custom-photo-list" class="py-1">
                            <!-- List fotografer akan disuntik dari JS -->
                        </ul>
                    </div>
                </div>

                <!-- SELECT EVENT BAWAAN (Karena tidak butuh gambar) -->
                <div class="md:col-span-5 relative z-20">
                    <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Event / Sesi</label>
                    <select id="select-event" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3.5 outline-none cursor-pointer transition disabled:opacity-50" disabled>
                        <option value="">Pilih Fotografer Dahulu</option>
                    </select>
                </div>

                <div class="md:col-span-3 flex items-end">
                    <button id="btn-load-event" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-xl text-sm px-5 py-3 text-center shadow-md shadow-blue-500/20 transition transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Tampilkan Foto
                    </button>
                </div>
            </div>
        </div>

        <!-- Filter Ciri-ciri -->
        <div id="filter-section" class="glass-card rounded-2xl p-5 md:p-6 mb-8 transition-opacity duration-300 opacity-50 pointer-events-none relative z-10">
            <h2 class="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
                Penyaringan Spesifik
            </h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <select id="filter-waktu" onchange="cariFoto()" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 block w-full p-2.5 outline-none cursor-pointer">
                    <option value="">⏱️ Semua Rentang Waktu</option>
                </select>
                <select id="filter-motor" onchange="cariFoto()" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 block w-full p-2.5 outline-none cursor-pointer">
                    <option value="">🏍️ Semua Warna Motor</option>
                    <option value="hitam">Hitam</option><option value="putih">Putih</option><option value="merah">Merah</option><option value="biru">Biru</option><option value="hijau">Hijau</option><option value="kuning">Kuning</option><option value="oranye">Oranye</option><option value="silver">Silver / Abu-abu</option><option value="pink">Pink</option><option value="cyan">Cyan</option>
                </select>
                <select id="filter-helm" onchange="cariFoto()" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 block w-full p-2.5 outline-none cursor-pointer">
                    <option value="">🪖 Semua Helm Depan</option>
                    <option value="hitam">Hitam</option><option value="putih">Putih</option><option value="merah">Merah</option><option value="biru">Biru</option><option value="hijau">Hijau</option><option value="kuning">Kuning</option><option value="oranye">Oranye</option><option value="silver">Silver / Abu-abu</option><option value="pink">Pink</option><option value="cyan">Cyan</option>
                </select>
                <select id="filter-jaket" onchange="cariFoto()" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 block w-full p-2.5 outline-none cursor-pointer">
                    <option value="">🧥 Semua Jaket Depan</option>
                    <option value="hitam">Hitam</option><option value="putih">Putih</option><option value="merah">Merah</option><option value="biru">Biru</option><option value="hijau">Hijau</option><option value="kuning">Kuning</option><option value="oranye">Oranye</option><option value="silver">Silver / Abu-abu</option><option value="pink">Pink</option><option value="cyan">Cyan</option>
                </select>
            </div>
        </div>

        <!-- Galeri Hasil -->
        <div id="hasil-galeri" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 relative z-0">
            <div class="col-span-full text-center py-16">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-700">Pilih Event Dahulu</h3>
                <p class="text-sm text-slate-500 mt-1">Silakan pilih nama fotografer dan event pada menu di atas untuk memuat foto.</p>
            </div>
        </div>
    </main>

    <!-- ================= FIREBASE SCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCO2QRZMA1Ui8J1eQA89o76oSc_YpfdEiU",
            authDomain: "find-your-photo-188a0.firebaseapp.com",
            projectId: "find-your-photo-188a0",
            storageBucket: "find-your-photo-188a0.firebasestorage.app",
            messagingSenderId: "212497999030",
            appId: "1:212497999030:web:82380565489f6140ebf217"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URL WEBHOOK GAS
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwCnZTJmkfKnxjXiEudEEO01ApI4-kIcj0pJbXM-iLy4EqWuzPSRVVAuABuDAswhy7b/exec";
        
        let eventMap = {}; 
        window.database = []; 
        
        const selEvent = document.getElementById('select-event');
        const btnLoad = document.getElementById('btn-load-event');
        const statusBar = document.getElementById('status-bar');

        // Custom Dropdown Elements
        const customTrigger = document.getElementById('custom-photo-trigger');
        const customSelected = document.getElementById('custom-photo-selected');
        const customMenu = document.getElementById('custom-photo-menu');
        const customList = document.getElementById('custom-photo-list');
        const customIcon = document.getElementById('custom-photo-icon');
        let selectedPhotographerEmail = "";

        // Fungsi Buka/Tutup Dropdown Fotografer
        window.toggleDropdown = function(e) {
            e.stopPropagation();
            if(customTrigger.classList.contains("pointer-events-none")) return;
            
            const isOpen = !customMenu.classList.contains("hidden");
            if (isOpen) {
                tutupDropdown();
            } else {
                customMenu.classList.remove("hidden");
                setTimeout(() => {
                    customMenu.classList.remove("opacity-0", "translate-y-[-10px]");
                    customIcon.classList.add("rotate-180");
                }, 10);
            }
        };

        window.tutupSemuaDropdown = function() {
            tutupDropdown();
        };

        function tutupDropdown() {
            if(!customMenu.classList.contains("hidden")) {
                customMenu.classList.add("opacity-0", "translate-y-[-10px]");
                customIcon.classList.remove("rotate-180");
                setTimeout(() => { customMenu.classList.add("hidden"); }, 200);
            }
        }

        // 1. Ambil Data Profil Users & Event dari Firebase
        async function fetchEventsFromFirebase() {
            try {
                // Fetch User Profiles (Foto Profil & Nama)
                const usersSnapshot = await getDocs(collection(db, "users"));
                const userProfiles = {};
                usersSnapshot.forEach(docSnap => {
                    const uData = docSnap.data();
                    if (uData.email) {
                        userProfiles[uData.email] = {
                            name: uData.custom_name || "Fotografer",
                            photo: uData.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(uData.custom_name || "F")}`
                        };
                    }
                });

                // Fetch Event selesai
                const q = query(collection(db, "queues"), where("status", "==", "Selesai"));
                const querySnapshot = await getDocs(q);
                
                eventMap = {};
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const pEmail = data.photographer_email || "unknown";
                    
                    const profile = userProfiles[pEmail] || {
                        name: data.photographer_name || "Fotografer Anonim",
                        photo: `https://ui-avatars.com/api/?name=${encodeURIComponent(data.photographer_name || "A")}`
                    };

                    if (!eventMap[pEmail]) {
                        eventMap[pEmail] = {
                            name: profile.name,
                            photo: profile.photo,
                            events: []
                        };
                    }

                    eventMap[pEmail].events.push({
                        eventName: data.event_name,
                        jsonFile: data.json_filename ? data.json_filename.split(/[\\/]/).pop() : null,
                        date: data.event_date || "-"
                    });
                });

                renderCustomDropdown();
            } catch (error) {
                console.error("Error fetching Firebase:", error);
                setStatus("🔴 Gagal memuat data.", "bg-red-50 text-red-700 border-red-200");
            }
        }

        // Render List Fotografer di Custom Dropdown
        function renderCustomDropdown() {
            const emails = Object.keys(eventMap);
            customList.innerHTML = '';
            
            if (emails.length === 0) {
                customSelected.innerHTML = `<span>Belum ada fotografer terdaftar</span>`;
                return;
            }

            customSelected.innerHTML = `<span>-- Pilih Fotografer --</span>`;
            
            // Opsi Reset
            const liReset = document.createElement("li");
            liReset.className = "px-4 py-2 hover:bg-slate-100 cursor-pointer text-slate-500 text-sm";
            liReset.textContent = "-- Batalkan Pilihan --";
            liReset.onclick = (e) => {
                e.stopPropagation();
                pilihFotografer("", "", "", true);
            };
            customList.appendChild(liReset);

            // Render setiap Fotografer dengan fotonya
            emails.forEach(email => {
                const pInfo = eventMap[email];
                const li = document.createElement("li");
                li.className = "px-4 py-2.5 hover:bg-blue-50 cursor-pointer flex items-center gap-3 border-b border-slate-50 last:border-0 transition";
                li.innerHTML = `
                    <img src="${pInfo.photo}" class="w-8 h-8 rounded-full object-cover shadow-sm border border-slate-200">
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-800 text-sm leading-tight">${pInfo.name}</span>
                        <span class="text-[10px] text-slate-400 leading-tight">${pInfo.events.length} Album Event</span>
                    </div>
                `;
                li.onclick = (e) => {
                    e.stopPropagation();
                    pilihFotografer(email, pInfo.name, pInfo.photo, false);
                };
                customList.appendChild(li);
            });

            customTrigger.classList.remove("pointer-events-none", "opacity-50");
            customTrigger.classList.add("bg-white");
            setStatus("🟢 Database Terhubung.", "bg-emerald-50 text-emerald-700 border-emerald-200");
        }

        // Aksi Saat Fotografer Dipilih dari Dropdown
        function pilihFotografer(email, name, photo, isReset) {
            tutupDropdown();
            selectedPhotographerEmail = email;
            selEvent.innerHTML = '<option value="">-- Pilih Event --</option>';

            if (isReset || !email) {
                customSelected.innerHTML = `<span>-- Pilih Fotografer --</span>`;
                selEvent.disabled = true;
                btnLoad.disabled = true;
                return;
            }

            // Ubah tampilan trigger saat dipilih
            customSelected.innerHTML = `
                <img src="${photo}" class="w-6 h-6 rounded-full object-cover shadow-sm border border-slate-200">
                <span class="font-bold text-slate-800">${name}</span>
            `;

            // Isi Dropdown Event Native
            const pInfo = eventMap[email];
            pInfo.events.forEach(ev => {
                if(ev.jsonFile) {
                    selEvent.innerHTML += `<option value="${ev.jsonFile}">${ev.eventName} (${ev.date})</option>`;
                }
            });

            selEvent.disabled = false;
        }

        selEvent.addEventListener('change', function() {
            btnLoad.disabled = !this.value;
        });

        btnLoad.addEventListener('click', function() {
            const jsonFilename = selEvent.value;
            if (jsonFilename) {
                muatDataDariGAS(jsonFilename);
            }
        });

        // 2. Ambil Data Foto (JSON) dari GAS
        function muatDataDariGAS(filename) {
            setStatus(`<svg class="w-3.5 h-3.5 animate-spin inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Mengambil foto dari Drive...`, "bg-blue-50 text-blue-700 border-blue-200");
            
            const fetchUrl = `${GAS_API_URL}?filename=${encodeURIComponent(filename)}&t=${new Date().getTime()}`;

            fetch(fetchUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "error") {
                        setStatus(`🔴 ${data.message}`, "bg-red-50 text-red-700 border-red-200");
                        window.database = [];
                    } else {
                        window.database = Array.isArray(data) ? data : [];
                        setStatus(`✅ Berhasil memuat ${window.database.length} foto!`, "bg-emerald-50 text-emerald-700 border-emerald-200");
                        
                        document.getElementById('filter-section').classList.remove('opacity-50', 'pointer-events-none');
                        
                        updateDropdownWaktu();
                        window.cariFoto();
                    }
                })
                .catch(error => {
                    setStatus(`🔴 Gagal mengambil data dari Google Drive API.`, "bg-red-50 text-red-700 border-red-200");
                });
        }

        function setStatus(html, colorClasses) {
            statusBar.className = `inline-flex items-center gap-2 px-3.5 py-1.5 border text-xs font-semibold rounded-full shadow-sm transition-all ${colorClasses}`;
            statusBar.innerHTML = html;
        }

        function updateDropdownWaktu() {
            const selectWaktu = document.getElementById('filter-waktu');
            const nilaiTerpilih = selectWaktu.value;
            const daftarKelompok = [...new Set(window.database.map(i => i.kelompok_waktu || 'Lainnya'))].sort();
            
            selectWaktu.innerHTML = '<option value="">⏱️ Semua Rentang Waktu</option>';
            daftarKelompok.forEach(waktu => {
                if (waktu && waktu !== '-') {
                    const opt = document.createElement('option');
                    opt.value = waktu;
                    opt.textContent = `⏰ Rentang ${waktu}`;
                    if (waktu === nilaiTerpilih) opt.selected = true;
                    selectWaktu.appendChild(opt);
                }
            });
        }

        window.cariFoto = function() {
            const fWaktu = document.getElementById('filter-waktu').value;
            const fMotor = document.getElementById('filter-motor').value;
            const fHelm = document.getElementById('filter-helm').value;
            const fJaket = document.getElementById('filter-jaket').value;

            const hasilFilter = window.database.filter(item => {
                const dataItem = item.data || {};
                const pDepan = dataItem.pengendara_depan || {};

                const cocokWaktu = fWaktu === "" || item.kelompok_waktu === fWaktu;
                const cocokMotor = fMotor === "" || dataItem.motor === fMotor;
                const cocokHelm = fHelm === "" || pDepan.helm === fHelm;
                const cocokJaket = fJaket === "" || pDepan.jaket === fJaket;
                return cocokWaktu && cocokMotor && cocokHelm && cocokJaket;
            });

            tampilkanGaleri(hasilFilter);
        }

        function tampilkanGaleri(data) {
            const galeri = document.getElementById('hasil-galeri');
            galeri.innerHTML = '';

            if (data.length === 0) {
                galeri.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <h3 class="text-lg font-semibold text-slate-700">Foto tidak ditemukan</h3>
                        <p class="text-sm text-slate-500 mt-1">Cobalah melonggarkan kriteria filter warna pakaian/motor.</p>
                    </div>`;
                return;
            }

            data.forEach(item => {
                let fileId = '';
                let webView = item.url_view_gdrive || '';
                let gdriveUrl = item.url_gdrive || '';
                let match = webView.match(/\/d\/([a-zA-Z0-9_-]+)/) || webView.match(/id=([a-zA-Z0-9_-]+)/) || gdriveUrl.match(/id=([a-zA-Z0-9_-]+)/) || gdriveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                
                if (match && match[1]) fileId = match[1];

                const imgSource = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w600` : 'https://via.placeholder.com/260?text=No+Image';
                const fullResUrl = webView !== '' ? webView : '#';

                const dataItem = item.data || {};
                const pDepan = dataItem.pengendara_depan || { helm: 'none', jaket: 'none' };
                const mColor = dataItem.motor || 'none';
                const hColor = pDepan.helm || 'none';
                const jColor = pDepan.jaket || 'none';

                galeri.innerHTML += `
                    <div class="glass-card rounded-2xl overflow-hidden group flex flex-col justify-between hover:shadow-xl hover:-translate-y-1 transition duration-300">
                        <div>
                            <div class="relative overflow-hidden cursor-pointer bg-slate-100 aspect-[4/3]" onclick="window.open('${fullResUrl}', '_blank')" title="Buka foto resolusi penuh">
                                <img src="${imgSource}" loading="lazy" class="w-full h-full object-cover transition duration-500 group-hover:scale-105" alt="${item.nama_file}">
                                <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition duration-300 flex items-center justify-center">
                                    <div class="bg-white/90 text-slate-800 text-xs font-bold px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition duration-300 transform translate-y-2 group-hover:translate-y-0 shadow-sm">
                                        Perbesar 🔍
                                    </div>
                                </div>
                            </div>
                            <div class="p-4">
                                <div class="flex justify-between items-start mb-3">
                                    <h3 class="font-bold text-slate-800 text-sm truncate pr-2" title="${item.nama_file}">${item.nama_file}</h3>
                                    <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-1 rounded-md whitespace-nowrap">⏰ ${item.waktu_jam || '-'}</span>
                                </div>
                                <div class="flex flex-wrap gap-1.5">
                                    ${mColor !== 'none' ? `<span class="badge ${mColor}">🏍️ ${mColor}</span>` : ''}
                                    ${hColor !== 'none' ? `<span class="badge ${hColor}">🪖 ${hColor}</span>` : ''}
                                    ${jColor !== 'none' ? `<span class="badge ${jColor}">🧥 ${jColor}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="px-4 pb-4 mt-auto">
                            <a href="${fullResUrl}" target="_blank" class="block w-full py-2.5 text-center bg-slate-50 hover:bg-slate-100 text-slate-600 font-semibold text-xs rounded-xl border border-slate-200 transition">
                                Buka di Google Drive ↗
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        fetchEventsFromFirebase();
    </script>
</body>
</html>
