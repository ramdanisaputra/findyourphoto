<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencarian Foto AI (Drive Edition)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        
        .status-bar {
            text-align: center; font-size: 13px; color: #15803d; background: #dcfce7;
            border: 1px solid #bbf7d0; padding: 8px 16px; border-radius: 20px;
            display: inline-block; margin-bottom: 15px; font-weight: 600;
        }

        .event-selector {
            background: white; padding: 15px 20px; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px;
            display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
        }

        .search-box { 
            background: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 30px; 
        }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; outline: none; }
        select, input { background-color: #fcfcfc; cursor: pointer; }
        button.btn-search { background-color: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; padding: 12px 25px; }
        button.btn-search:hover { background-color: #1d4ed8; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { 
            background: white; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; padding-bottom: 15px; 
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        
        .card-img-wrapper { position: relative; cursor: pointer; overflow: hidden; }
        .card img { width: 100%; height: 260px; object-fit: cover; background-color: #eee; transition: transform 0.3s; display: block; }
        .card-img-wrapper:hover img { transform: scale(1.04); }
        
        .drive-btn {
            display: inline-block; margin-top: 10px; padding: 8px 14px;
            background-color: #0f9d58; color: white; text-decoration: none;
            font-size: 13px; font-weight: bold; border-radius: 6px; transition: background 0.2s;
        }
        .drive-btn:hover { background-color: #0b8043; }

        .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin: 3px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); text-transform: capitalize; }
        .badge-time { background-color: #4f46e5; color: white; text-shadow: none; font-weight: 600; }
        .hitam { background-color: #222; } 
        .putih { background-color: #f8f9fa; color: #333; border: 1px solid #ccc; text-shadow: none;}
        .merah { background-color: #dc3545; } 
        .biru { background-color: #0d6efd; }
        .hijau { background-color: #198754; } 
        .kuning { background-color: #ffc107; color: #333; text-shadow: none;}
        .oranye { background-color: #fd7e14; } 
        .abu-abu, .silver { background-color: #6c757d; }
        .pink { background-color: #e83e8c; }
        .cyan { background-color: #0dcaf0; color: #222; text-shadow: none; }
        .cokelat { background-color: #795548; }
        .ungu { background-color: #6f42c1; }
        .marun { background-color: #800000; }
        .none { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🏍️ AI Photo Finder (Drive Edition)</h2>
            <p>Cari foto berdasarkan waktu, warna motor, helm, dan jaket</p>
            
            <div class="status-bar" id="status-bar">
                🟢 Live Sync GAS: Memuat data...
            </div>
        </div>

        <!-- Input Nama File Event JSON -->
        <div class="event-selector">
            <label for="input-filename"><strong>📁 Nama File Database Event:</strong></label>
            <input type="text" id="input-filename" placeholder="database_namaevent_xxxx.json" style="width: 320px;">
            <button class="btn-search" onclick="gantiEvent()" style="padding: 10px 18px;">Muat Event</button>
        </div>
        
        <div class="search-box">
            <select id="filter-waktu" onchange="cariFoto()">
                <option value="">-- Semua Rentang Waktu --</option>
            </select>
            <select id="filter-motor" onchange="cariFoto()">
                <option value="">-- Semua Warna Motor --</option>
                <option value="hitam">Hitam</option>
                <option value="putih">Putih</option>
                <option value="merah">Merah</option>
                <option value="biru">Biru</option>
                <option value="hijau">Hijau</option>
                <option value="kuning">Kuning</option>
                <option value="oranye">Oranye</option>
                <option value="silver">Silver / Abu-abu</option>
                <option value="pink">Pink</option>
                <option value="cyan">Cyan</option>
                <option value="cokelat">Cokelat</option>
                <option value="ungu">Ungu</option>
                <option value="marun">Marun</option>
            </select>
            <select id="filter-helm" onchange="cariFoto()">
                <option value="">-- Semua Helm (Depan) --</option>
                <option value="hitam">Hitam</option>
                <option value="putih">Putih</option>
                <option value="merah">Merah</option>
                <option value="biru">Biru</option>
                <option value="hijau">Hijau</option>
                <option value="kuning">Kuning</option>
                <option value="oranye">Oranye</option>
                <option value="silver">Silver / Abu-abu</option>
                <option value="pink">Pink</option>
                <option value="cyan">Cyan</option>
                <option value="cokelat">Cokelat</option>
                <option value="ungu">Ungu</option>
                <option value="marun">Marun</option>
            </select>
            <select id="filter-jaket" onchange="cariFoto()">
                <option value="">-- Semua Jaket (Depan) --</option>
                <option value="hitam">Hitam</option>
                <option value="putih">Putih</option>
                <option value="merah">Merah</option>
                <option value="biru">Biru</option>
                <option value="hijau">Hijau</option>
                <option value="kuning">Kuning</option>
                <option value="oranye">Oranye</option>
                <option value="silver">Silver / Abu-abu</option>
                <option value="pink">Pink</option>
                <option value="cyan">Cyan</option>
                <option value="cokelat">Cokelat</option>
                <option value="ungu">Ungu</option>
                <option value="marun">Marun</option>
            </select>
            <button class="btn-search" onclick="cariFoto()">🔍 Filter Foto</button>
        </div>

        <div class="gallery" id="hasil-galeri"></div>
    </div>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT (GAS) KAMU DI SINI:
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwCnZTJmkfKnxjXiEudEEO01ApI4-kIcj0pJbXM-iLy4EqWuzPSRVVAuABuDAswhy7b/exec";

        let database = [];
        let currentFilename = "";

        // Fungsi membaca nama file dari URL parameter ?file=
        function getFilenameFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('file') || "database_motor_gdrive.json";
        }

        currentFilename = getFilenameFromURL();
        document.getElementById('input-filename').value = currentFilename;

        function muatDatabase() {
            if (!GAS_API_URL || GAS_API_URL.includes("ISI_DENGAN_URL_WEB_APP_GAS_KAMU")) {
                document.getElementById('status-bar').innerHTML = 
                    '⚠️ Harap masukkan URL Web App GAS pada variabel <code>GAS_API_URL</code> di file index.html';
                return;
            }

            const fetchUrl = `${GAS_API_URL}?filename=${encodeURIComponent(currentFilename)}&t=${new Date().getTime()}`;

            fetch(fetchUrl)
                .then(response => {
                    if (!response.ok) throw new Error("Gagal mengambil data dari GAS API");
                    return response.json();
                })
                .then(data => {
                    if (data.status === "error") {
                        document.getElementById('status-bar').innerHTML = 
                            `🔴 ${data.message} (${currentFilename})`;
                        database = [];
                        cariFoto();
                        return;
                    }

                    database = Array.isArray(data) ? data : [];
                    document.getElementById('status-bar').innerHTML = 
                        `🟢 Live GAS Sync Aktif | Event: <strong>${currentFilename}</strong> | Total Foto: <strong>${database.length}</strong>`;
                    updateDropdownWaktu();
                    cariFoto();
                })
                .catch(error => {
                    document.getElementById('status-bar').innerHTML = 
                        `🔴 Menunggu data dari GAS API... (${currentFilename})`;
                });
        }

        function gantiEvent() {
            const inputVal = document.getElementById('input-filename').value.trim();
            if (inputVal) {
                currentFilename = inputVal;
                muatDatabase();
            }
        }

        function updateDropdownWaktu() {
            const selectWaktu = document.getElementById('filter-waktu');
            const nilaiTerpilih = selectWaktu.value;
            const daftarKelompok = [...new Set(database.map(i => i.kelompok_waktu || 'Lainnya'))].sort();
            
            selectWaktu.innerHTML = '<option value="">-- Semua Rentang Waktu --</option>';
            daftarKelompok.forEach(waktu => {
                if (waktu && waktu !== '-') {
                    const opt = document.createElement('option');
                    opt.value = waktu;
                    opt.textContent = `⏰ Rentang ${waktu}`;
                    if (waktu === nilaiTerpilih) opt.selected = true;
                    selectWaktu.appendChild(opt);
                }
            });
        }

        muatDatabase();
        setInterval(muatDatabase, 10000); // Sinkronisasi otomatis setiap 10 detik

        function cariFoto() {
            const fWaktu = document.getElementById('filter-waktu').value;
            const fMotor = document.getElementById('filter-motor').value;
            const fHelm = document.getElementById('filter-helm').value;
            const fJaket = document.getElementById('filter-jaket').value;

            const hasilFilter = database.filter(item => {
                const dataItem = item.data || {};
                const pDepan = dataItem.pengendara_depan || {};

                const cocokWaktu = fWaktu === "" || item.kelompok_waktu === fWaktu;
                const cocokMotor = fMotor === "" || dataItem.motor === fMotor;
                const cocokHelm = fHelm === "" || pDepan.helm === fHelm;
                const cocokJaket = fJaket === "" || pDepan.jaket === fJaket;
                return cocokWaktu && cocokMotor && cocokHelm && cocokJaket;
            });

            tampilkanGaleri(hasilFilter);
        }

        function tampilkanGaleri(data) {
            const galeri = document.getElementById('hasil-galeri');
            galeri.innerHTML = '';

            if (data.length === 0) {
                galeri.innerHTML = '<h3 style="grid-column: 1 / -1; text-align: center; color: #777; margin-top: 40px;">Belum ada foto yang cocok...</h3>';
                return;
            }

            data.forEach(item => {
                let fileId = '';
                let webView = item.url_view_gdrive || '';
                let gdriveUrl = item.url_gdrive || '';

                let match = webView.match(/\/d\/([a-zA-Z0-9_-]+)/) || webView.match(/id=([a-zA-Z0-9_-]+)/);
                if (!match) {
                    match = gdriveUrl.match(/id=([a-zA-Z0-9_-]+)/) || gdriveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                }

                if (match && match[1]) {
                    fileId = match[1];
                }

                let imgSource = '';
                let fullResUrl = webView !== '' ? webView : '#';

                if (fileId) {
                    imgSource = `https://drive.google.com/thumbnail?id=${fileId}&sz=w600`;
                } else {
                    imgSource = 'https://via.placeholder.com/260?text=No+Image';
                }

                const dataItem = item.data || {};
                const pDepan = dataItem.pengendara_depan || { helm: 'none', jaket: 'none' };
                const motorColor = dataItem.motor || 'none';
                const helmColor = pDepan.helm || 'none';
                const jaketColor = pDepan.jaket || 'none';
                const jamFoto = item.waktu_jam || '-';
                const slotWaktu = item.kelompok_waktu || '-';

                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div>
                        <div class="card-img-wrapper" onclick="window.open('${fullResUrl}', '_blank')" title="Klik untuk membuka foto di Google Drive">
                            <img src="${imgSource}" loading="lazy" alt="${item.nama_file}" onerror="this.src='https://via.placeholder.com/260?text=Gagal+Muat+Gambar'">
                        </div>
                        <div style="padding: 12px 10px 5px 10px;">
                            <strong style="font-size: 13px; color: #555;">📁 ${item.nama_file}</strong><br>
                            <span class="badge badge-time">⏰ Jam ${jamFoto} (${slotWaktu})</span><br>
                            <span class="badge ${motorColor}">🏍️ Motor: ${motorColor}</span><br>
                            <span class="badge ${helmColor}">🪖 Helm: ${helmColor}</span><br>
                            <span class="badge ${jaketColor}">🧥 Jaket: ${jaketColor}</span>
                        </div>
                    </div>
                    <div style="padding: 0 10px 12px 10px;">
                        <a href="${fullResUrl}" target="_blank" class="drive-btn">📂 Buka di Google Drive ↗</a>
                    </div>
                `;
                galeri.appendChild(div);
            });
        }
    </script>
</body>
</html>
