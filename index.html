    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }

        /* Badge warna custom transparan modern */
        .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 9999px; font-size: 10px; font-weight: 700; text-transform: capitalize; border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(8px); }
        .hitam { background-color: rgba(15, 23, 42, 0.8); color: #f8fafc; }
        .putih { background-color: rgba(255, 255, 255, 0.9); color: #0f172a; border-color: transparent; }
        .merah { background-color: rgba(239, 68, 68, 0.85); color: white; }
        .biru { background-color: rgba(59, 130, 246, 0.85); color: white; }
        .biru-muda { background-color: rgba(96, 165, 250, 0.9); color: #0f172a; }
        .biru-tua { background-color: rgba(30, 64, 175, 0.9); color: white; }
        .hijau { background-color: rgba(34, 197, 94, 0.85); color: white; }
        .hijau-muda { background-color: rgba(134, 239, 172, 0.9); color: #14532d; }
        .kuning { background-color: rgba(234, 179, 8, 0.9); color: #422006; }
        .oranye { background-color: rgba(249, 115, 22, 0.85); color: white; }
        .abu-abu, .silver { background-color: rgba(148, 163, 184, 0.85); color: white; }
        .pink { background-color: rgba(236, 72, 153, 0.85); color: white; }
        .cyan { background-color: rgba(6, 182, 212, 0.85); color: #083344; }
        .cokelat { background-color: rgba(139, 92, 246, 0.85); color: white; }
        .ungu { background-color: rgba(168, 85, 247, 0.85); color: white; }
        .marun { background-color: rgba(159, 18, 57, 0.85); color: white; }
        .krem { background-color: rgba(245, 222, 179, 0.9); color: #451a03; }
        .emas { background-color: rgba(234, 179, 8, 0.9); color: #422006; }
        .tidak-terlihat { background-color: rgba(71, 85, 105, 0.9); color: white; }
        .none { display: none; }
    </style>
</head>
<body class="pb-20 selection:bg-blue-500 selection:text-white">

        <!-- Filter Ciri-ciri -->

                    <option value="">🪖 Semua Helm Depan</option>

                    <option value="">🧥 Semua Jaket Depan</option>

        <!-- Galeri Hasil -->
        <div id="hasil-galeri" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-16">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800/80 text-slate-500 mb-4 border border-slate-700">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>

    <!-- ================= FIREBASE SCRIPT ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCO2QRZMA1Ui8J1eQA89o76oSc_YpfdEiU",
            authDomain: "find-your-photo-188a0.firebaseapp.com",
            projectId: "find-your-photo-188a0",
            storageBucket: "find-your-photo-188a0.firebasestorage.app",
            messagingSenderId: "212497999030",
            appId: "1:212497999030:web:82380565489f6140ebf217"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwCnZTJmkfKnxjXiEudEEO01ApI4-kIcj0pJbXM-iLy4EqWuzPSRVVAuABuDAswhy7b/exec";

        let eventMap = {};
        window.database = [];

        const selPhoto = document.getElementById('select-photographer');
        const selEvent = document.getElementById('select-event');
        const btnLoad = document.getElementById('btn-load-event');
        const statusBar = document.getElementById('status-bar');
        const badgePhotographer = document.getElementById('photographer-badge');
        const avatarPhotographer = document.getElementById('photographer-avatar');
        const namePhotographer = document.getElementById('photographer-display-name');

        // 1. Ambil data profil pengguna dan event dari Firebase.
        async function fetchEventsFromFirebase() {
            try {
                const usersSnapshot = await getDocs(collection(db, "users"));
                const userProfiles = {};

                usersSnapshot.forEach(docSnap => {
                    const uData = docSnap.data();
                    if (uData.email) {
                        userProfiles[uData.email] = {
                            name: uData.custom_name || "Fotografer",
                            photo: uData.photo_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(uData.custom_name || "F")}`
                        };
                    }
                });

                const q = query(collection(db, "queues"), where("status", "==", "Selesai"));
                const querySnapshot = await getDocs(q);

                eventMap = {};
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const pEmail = data.photographer_email || "unknown";

                    const profile = userProfiles[pEmail] || {
                        name: data.photographer_name || "Fotografer Anonim",
                        photo: `https://ui-avatars.com/api/?name=${encodeURIComponent(data.photographer_name || "A")}`
                    };

                    if (!eventMap[pEmail]) {
                        eventMap[pEmail] = {
                            name: profile.name,
                            photo: profile.photo,
                            events: []
                        };
                    }

                    eventMap[pEmail].events.push({
                        eventName: data.event_name,
                        jsonFile: data.json_filename ? data.json_filename.split(/[\\/]/).pop() : null,
                        date: data.event_date || "-"
                    });
                });

                populatePhotographers();
            } catch (error) {
                console.error("Error fetching Firebase:", error);
                setStatus("🔴 Gagal memuat daftar event dari database.", "bg-red-950/60 text-red-300 border-red-800/60");
            }
        }

        function populatePhotographers() {
            const emails = Object.keys(eventMap);
            selPhoto.innerHTML = '<option value="">-- Pilih Fotografer --</option>';

            if (emails.length === 0) {
                selPhoto.innerHTML = '<option value="">Belum ada event tersedia</option>';
                setStatus("ℹ️ Belum ada event yang selesai diproses AI.", "bg-slate-800 text-slate-300 border-slate-700");
                return;
            }

            emails.forEach(email => {
                const pInfo = eventMap[email];
                const option = document.createElement('option');
                option.value = email;
                option.textContent = pInfo.name;
                selPhoto.appendChild(option);
            });

            selPhoto.disabled = false;
            setStatus("🟢 Database Terhubung. Silakan pilih Fotografer.", "bg-emerald-950/60 text-emerald-300 border-emerald-800/60");
        }

        selPhoto.addEventListener('change', function() {
            const pEmail = this.value;
            selEvent.innerHTML = '<option value="">-- Pilih Event --</option>';
            btnLoad.disabled = true;

            if (!pEmail || !eventMap[pEmail]) {
                selEvent.disabled = true;
                badgePhotographer.classList.add("hidden");
                badgePhotographer.classList.remove("flex");
                return;
            }

            const pInfo = eventMap[pEmail];
            avatarPhotographer.src = pInfo.photo;
            namePhotographer.textContent = pInfo.name;
            badgePhotographer.classList.remove("hidden");
            badgePhotographer.classList.add("flex");

            pInfo.events.forEach(ev => {
                if (ev.jsonFile) {
                    const option = document.createElement('option');
                    option.value = ev.jsonFile;
                    option.textContent = `${ev.eventName || 'Event tanpa nama'} (${ev.date})`;
                    selEvent.appendChild(option);
                }
            });

            selEvent.disabled = false;
        });

        selEvent.addEventListener('change', function() {
            btnLoad.disabled = !this.value;
        });

        btnLoad.addEventListener('click', function() {
            const jsonFilename = selEvent.value;
            if (jsonFilename) muatDataDariGAS(jsonFilename);
        });

        // 2. Ambil database JSON dari Apps Script / Google Drive.
        async function muatDataDariGAS(filename) {
            setStatus(
                '<svg class="w-3.5 h-3.5 animate-spin inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> Mengambil foto dari Drive...',
                "bg-blue-950/60 text-blue-300 border-blue-800/60"
            );
            btnLoad.disabled = true;

            const fetchUrl = `${GAS_API_URL}?filename=${encodeURIComponent(filename)}&t=${Date.now()}`;

            try {
                const response = await fetch(fetchUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (data.status === "error") {
                    setStatus(`🔴 ${data.message || "Gagal mengambil database."}`, "bg-red-950/60 text-red-300 border-red-800/60");
                    window.database = [];
                } else {
                    window.database = Array.isArray(data) ? data : [];
                    setStatus(`✅ Berhasil memuat ${window.database.length} foto!`, "bg-emerald-950/60 text-emerald-300 border-emerald-800/60");
                    document.getElementById('filter-section').classList.remove('opacity-50', 'pointer-events-none');
                    updateDropdownWaktu();
                    window.cariFoto();
                }
            } catch (error) {
                console.error("Error loading JSON from GAS:", error);
                setStatus("🔴 Gagal mengambil data dari Google Drive API.", "bg-red-950/60 text-red-300 border-red-800/60");
            } finally {
                btnLoad.disabled = !selEvent.value;
            }
        }

        function setStatus(html, colorClasses) {
            statusBar.className = `inline-flex items-center gap-2 px-3.5 py-1.5 border text-xs font-semibold rounded-full shadow-sm transition-all ${colorClasses}`;
            statusBar.innerHTML = html;
        }

        function updateDropdownWaktu() {
            const selectWaktu = document.getElementById('filter-waktu');
            const nilaiTerpilih = selectWaktu.value;
            const daftarKelompok = [...new Set(window.database.map(i => i.kelompok_waktu || 'Lainnya'))].sort();

            selectWaktu.innerHTML = '<option value="">⏱️ Semua Rentang Waktu</option>';
            daftarKelompok.forEach(waktu => {
                if (waktu && waktu !== '-') {
                    const option = document.createElement('option');
                    option.value = waktu;
                    option.textContent = `⏰ Rentang ${waktu}`;
                    if (waktu === nilaiTerpilih) option.selected = true;
                    selectWaktu.appendChild(option);
                }
            });
        }

        // Membantu filter dengan satu nilai atau beberapa label warna.
        function warnaCocok(filterValue, warnaData) {
            if (filterValue === "") return true;
            return filterValue.split(",").includes(String(warnaData || ""));
        }

        window.cariFoto = function() {
            const fWaktu = document.getElementById('filter-waktu').value;
            const fMotor = document.getElementById('filter-motor').value;
            const fHelm = document.getElementById('filter-helm').value;
            const fJaket = document.getElementById('filter-jaket').value;

            const hasilFilter = window.database.filter(item => {
                const dataItem = item.data || {};
                const pDepan = dataItem.pengendara_depan || {};

                const cocokWaktu = fWaktu === "" || item.kelompok_waktu === fWaktu;
                const cocokMotor = warnaCocok(fMotor, dataItem.motor);
                const cocokHelm = warnaCocok(fHelm, pDepan.helm);
                const cocokJaket = warnaCocok(fJaket, pDepan.jaket);

                return cocokWaktu && cocokMotor && cocokHelm && cocokJaket;
            });

            tampilkanGaleri(hasilFilter);
        };

        function classWarna(warna) {
            return String(warna || "none")
                .trim()
                .toLowerCase()
                .replace(/\s+/g, "-");
        }

        // Galeri foto full-bleed.
        function tampilkanGaleri(data) {
            const galeri = document.getElementById('hasil-galeri');
            galeri.innerHTML = '';

            if (data.length === 0) {
                galeri.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 text-slate-500 mb-4 border border-slate-700">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <h3 class="text-lg font-semibold text-slate-200">Foto tidak ditemukan</h3>
                        <p class="text-sm text-slate-400 mt-1">Cobalah melonggarkan kriteria filter warna pakaian/motor.</p>
                    </div>`;
                return;
            }

            data.forEach(item => {
                let fileId = '';
                const webView = item.url_view_gdrive || '';
                const gdriveUrl = item.url_gdrive || '';
                const match = webView.match(/\/d\/([a-zA-Z0-9_-]+)/)
                    || webView.match(/id=([a-zA-Z0-9_-]+)/)
                    || gdriveUrl.match(/id=([a-zA-Z0-9_-]+)/)
                    || gdriveUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);

                if (match && match[1]) fileId = match[1];

                const imgSource = fileId
                    ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w600`
                    : 'https://via.placeholder.com/260?text=No+Image';
                const fullResUrl = webView !== '' ? webView : '#';

                const dataItem = item.data || {};
                const pDepan = dataItem.pengendara_depan || { helm: 'none', jaket: 'none' };
                const mColor = dataItem.motor || 'none';
                const hColor = pDepan.helm || 'none';
                const jColor = pDepan.jaket || 'none';
                const namaFile = item.nama_file || 'Foto tanpa nama';
                const waktuJam = item.waktu_jam || '-';

                galeri.innerHTML += `
                    <div class="relative rounded-2xl overflow-hidden group aspect-[3/4] border border-slate-700/60 shadow-xl hover:shadow-2xl hover:-translate-y-1 transition duration-500 flex flex-col justify-end bg-slate-900">
                        <img src="${imgSource}" loading="lazy" class="absolute inset-0 w-full h-full object-cover object-[center_20%] group-hover:scale-105 transition duration-700 ease-out" alt="${namaFile}">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent opacity-90 group-hover:opacity-95 transition duration-300"></div>

                        <div class="absolute inset-0 z-10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300 cursor-pointer" onclick="window.open('${fullResUrl}', '_blank', 'noopener,noreferrer')">
                            <div class="bg-white/90 text-slate-900 text-xs font-extrabold px-4 py-2 rounded-full shadow-2xl backdrop-blur-md transform translate-y-2 group-hover:translate-y-0 transition duration-300">
                                Perbesar 🔍
                            </div>
                        </div>

                        <div class="relative z-20 p-4 flex flex-col justify-end">
                            <div class="flex justify-between items-center mb-2.5">
                                <h3 class="font-bold text-white text-sm truncate pr-2 shadow-sm" title="${namaFile}">${namaFile}</h3>
                                <span class="bg-white/20 backdrop-blur-md text-white text-[10px] font-bold px-2 py-1 rounded-md border border-white/20 whitespace-nowrap shadow-sm">⏰ ${waktuJam}</span>
                            </div>

                            <div class="flex flex-wrap gap-1.5 mb-3">
                                ${mColor !== 'none' ? `<span class="badge ${classWarna(mColor)}">🏍️ ${mColor}</span>` : ''}
                                ${hColor !== 'none' ? `<span class="badge ${classWarna(hColor)}">🪖 ${hColor}</span>` : ''}
                                ${jColor !== 'none' ? `<span class="badge ${classWarna(jColor)}">🧥 ${jColor}</span>` : ''}
                            </div>

                            <a href="${fullResUrl}" target="_blank" rel="noopener noreferrer" class="block w-full py-2.5 text-center bg-white/15 hover:bg-white/30 text-white font-semibold text-xs rounded-xl backdrop-blur-md border border-white/20 transition shadow-sm active:scale-95">
                                Buka di Google Drive ↗
                            </a>
                        </div>
                    </div>`;
            });
        }

        fetchEventsFromFirebase();
    </script>
</body>
</html>
